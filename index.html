<!-- Run: python3 -m http.server 8000 -->
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ - Jen buď EPIC</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 { margin-bottom: 20px; text-align: center; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls select {
            flex: 1;
            min-width: 200px;
            padding: 8px 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .controls button {
            padding: 8px 16px;
            font-size: 0.9rem;
            border: none;
            border-radius: 4px;
            background: #555;
            color: #fff;
            cursor: pointer;
        }
        .controls button:hover { background: #333; }
        .tag-desc {
            margin-bottom: 16px;
            padding: 8px 12px;
            background: #e8f4fd;
            border-left: 4px solid #2196F3;
            border-radius: 4px;
            font-style: italic;
            display: none;
        }
        .faq-item {
            background: #fff;
            margin-bottom: 6px;
            border-radius: 4px;
            border: 1px solid #ddd;
            overflow: hidden;
        }
        .faq-question {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .faq-question:hover { background: #f0f0f0; }
        .faq-question::after {
            content: '▸';
            transition: transform 0.2s;
            font-size: 1.2em;
        }
        .faq-item.open .faq-question::after { transform: rotate(90deg); }
        .faq-answer {
            display: none;
            padding: 0 16px 12px 16px;
            color: #555;
            line-height: 1.5;
        }
        .faq-item.open .faq-answer { display: block; }
        .faq-tags {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #999;
        }
        .faq-tags a.tag-link {
            color: #2196F3;
            cursor: pointer;
            text-decoration: none;
        }
        .faq-tags a.tag-link:hover {
            text-decoration: underline;
        }
        .count { font-size: 0.85rem; color: #777; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>FAQ – Jen buď EPIC</h1>
    <div class="controls">
        <select id="tagFilter">
            <option value="">-- Všechny otázky --</option>
        </select>
        <button id="closeAll">Zavřít vše</button>
    </div>
    <div class="tag-desc" id="tagDesc"></div>
    <div class="count" id="count"></div>
    <div id="faqList"></div>

    <script>
        let tags = [];
        let faqs = [];

        function parsePipeSeparated(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].split('|');
            return lines.slice(1).filter(l => l.trim()).map(line => {
                const values = line.split('|');
                const obj = {};
                headers.forEach((h, i) => obj[h.trim()] = (values[i] || '').trim());
                return obj;
            });
        }

        async function loadData() {
            const [tagsResp, faqResp] = await Promise.all([
                fetch('faq_tags_cz.csv').then(r => r.text()),
                fetch('faq.csv').then(r => r.text())
            ]);
            tags = parsePipeSeparated(tagsResp);
            faqs = parsePipeSeparated(faqResp);
            buildUI();
        }

        function buildUI() {
            const select = document.getElementById('tagFilter');
            tags.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.tag;
                opt.textContent = t.name;
                opt.title = t.desc;
                select.appendChild(opt);
            });
            select.addEventListener('change', render);
            document.getElementById('closeAll').addEventListener('click', () => {
                document.querySelectorAll('.faq-item.open').forEach(el => el.classList.remove('open'));
            });
            render();
        }

        function render() {
            const selectedTag = document.getElementById('tagFilter').value;
            const descEl = document.getElementById('tagDesc');

            if (selectedTag) {
                const tagObj = tags.find(t => t.tag === selectedTag);
                descEl.textContent = tagObj ? tagObj.desc : '';
                descEl.style.display = 'block';
            } else {
                descEl.style.display = 'none';
            }

            const filtered = selectedTag
                ? faqs.filter(f => f.tags.split(',').map(t => t.trim()).includes(selectedTag))
                : faqs;

            document.getElementById('count').textContent = `Zobrazeno ${filtered.length} z ${faqs.length} otázek`;

            const container = document.getElementById('faqList');
            container.innerHTML = filtered.map(f => {
                const tagLinks = f.tags.split(',').map(t => t.trim()).filter(Boolean).map(t => {
                    const tagObj = tags.find(to => to.tag === t);
                    const label = tagObj ? tagObj.name : t;
                    return `<a class="tag-link" data-tag="${t}">${label}</a>`;
                }).join(', ');
                return `
                <div class="faq-item">
                    <div class="faq-question">${f.question}</div>
                    <div class="faq-answer">
                        ${f.answer}
                        <div class="faq-tags">Tagy: ${tagLinks}</div>
                    </div>
                </div>`;
            }).join('');

            container.querySelectorAll('.faq-question').forEach(q => {
                q.addEventListener('click', () => q.parentElement.classList.toggle('open'));
            });

            container.querySelectorAll('.tag-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const select = document.getElementById('tagFilter');
                    select.value = e.target.dataset.tag;
                    render();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        loadData();
    </script>
</body>
</html>
